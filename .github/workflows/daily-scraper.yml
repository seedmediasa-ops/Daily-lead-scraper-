name: Daily Lead Scraper

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - name: Scrape Durban and Johannesburg (OpenStreetMap, no API key needed)
      run: python seedmediaa_scraper.py --city both --all --limit 50
    - name: Commit results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add leads_output/
        git diff --staged --quiet || git commit -m "Daily leads: $(date +%Y-%m-%d)"
        git push
